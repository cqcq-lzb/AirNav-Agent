services:
  airway-gpu-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: airway-navigation:latest
    container_name: airway-navigation
    restart: unless-stopped
    shm_size: "8gb"
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    environment:
      API_TOKEN: "${API_TOKEN:?Set API_TOKEN in .env}"
      DEFAULT_GPU: "${DEFAULT_GPU:-0}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-1}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-4294967296}"
    volumes:
      - ./runtime_data:/data
      - ./runtime_cases:/data2/home/wcq/nnUNet/nav_project/engineering_demo/cases
      - ./runtime_status:/data2/home/wcq/nnUNet/nav_project/engineering_demo/pipeline_status
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${NVIDIA_VISIBLE_DEVICES:-3}"
              capabilities:
                - gpu
