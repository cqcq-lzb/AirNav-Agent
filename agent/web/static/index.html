<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirNav-Agent 网页版</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --line:#e3e6ea; --line-2:#eef0f3;
    --tx:#1c2530; --tx-2:#5b6672; --tx-3:#8a949e;
    --accent:#185FA5; --accent-bg:#e8f1fa;
    --ok:#0f6e56; --ok-bg:#e3f4ee;
    --warn:#8a5a0b; --warn-bg:#fbf1dd;
    --bad:#a32d2d; --bad-bg:#fbeaea;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
    --sans:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.65 var(--sans)}
  button,input,select,textarea{font:inherit;color:inherit}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
  header .sub{font-size:12px;color:var(--tx-3)}
  header .spacer{flex:1}
  .field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx-2)}
  .field select,.field input{height:30px;padding:0 8px;border:1px solid var(--line);
    border-radius:6px;background:#fff}
  .field input{width:70px}
  #status{font-size:12px;color:var(--tx-3);min-width:64px;text-align:right}

  main{display:grid;grid-template-columns:minmax(0,1fr) 396px;gap:0;height:calc(100% - 52px)}
  @media (max-width:1080px){ main{grid-template-columns:minmax(0,1fr)} aside{display:none} }

  .chat{display:flex;flex-direction:column;min-width:0;height:100%}
  #log{flex:1;overflow-y:auto;padding:18px 20px 6px;display:flex;flex-direction:column;gap:12px}

  .msg{max-width:min(760px,92%);border-radius:10px;padding:10px 13px;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px}
  .msg.agent{align-self:flex-start;background:var(--panel);border:1px solid var(--line);
    border-bottom-left-radius:3px;line-height:1.75}
  .msg.agent code{font:12px/1.5 var(--mono);background:var(--line-2);padding:1px 5px;border-radius:4px}
  .msg.agent strong{font-weight:600}
  .msg.agent ul{margin:6px 0 0;padding-left:18px}
  .msg.agent li{margin:2px 0}
  .msg.err{align-self:flex-start;background:var(--bad-bg);border:1px solid #f0c8c8;color:var(--bad)}
  .inline-art{margin:6px 2px 2px;padding:5px 12px;border:1px solid var(--accent);border-radius:6px;
    background:var(--accent-bg);color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer}
  .inline-art:hover{background:#d8e8f7}
  /* 模型引用了没有文件的产物（比如把 route-001 当链接）。就地说明，别让它变破图。 */
  .dead-ref{display:inline-block;margin:4px 2px;padding:3px 9px;border-radius:6px;
    background:var(--warn-bg);border:1px solid #f0d9b0;color:var(--warn);font-size:12px}

  .runbox{align-self:flex-start;width:min(760px,92%);display:flex;flex-direction:column;gap:6px}
  .step{font-size:11px;color:var(--tx-3);letter-spacing:.4px;margin-top:2px}

  .tool{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:8px 11px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .tool .nm{font:12px/1.5 var(--mono);font-weight:600;color:var(--accent)}
  .tool .ar{font:11px/1.5 var(--mono);color:var(--tx-2);word-break:break-all;flex:1;min-width:120px}
  .tool .ms{font-size:11px;color:var(--tx-3);font-variant-numeric:tabular-nums}
  .pill{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
  .pill.run{background:var(--accent-bg);color:var(--accent);border-color:#cfe2f4}
  .pill.ok{background:var(--ok-bg);color:var(--ok);border-color:#c4e6da}
  .pill.fail{background:var(--bad-bg);color:var(--bad);border-color:#f0c8c8}

  .note{border-radius:8px;padding:7px 11px;font-size:12px;border:1px solid transparent}
  .note.defer{background:var(--warn-bg);color:var(--warn);border-color:#f0ddb8}
  .note.corr{background:#f3ecfb;color:#5b3f96;border-color:#ddd0f2}

  .stats{align-self:flex-start;font:12px/1.6 var(--mono);color:var(--tx-3);padding:2px 4px}
  .stats b{color:var(--tx-2);font-weight:600}

  form#composer{display:flex;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line);
    background:var(--panel);align-items:flex-end}
  #q{flex:1;min-height:44px;max-height:150px;resize:vertical;padding:10px 12px;
    border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
  #q:focus{border-color:#b8d3ec;box-shadow:0 0 0 3px var(--accent-bg)}
  #send{height:44px;padding:0 20px;border:0;border-radius:9px;background:var(--accent);
    color:#fff;font-weight:600;cursor:pointer}
  #send:disabled{background:#b6c4d2;cursor:not-allowed}

  aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px 16px 24px}
  aside h2{font-size:12px;font-weight:600;color:var(--tx-3);letter-spacing:.6px;
    text-transform:uppercase;margin:16px 0 8px}
  aside h2:first-child{margin-top:0}
  .cases{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:20px;
    background:#fff;cursor:pointer;transition:.12s}
  .chip:hover{border-color:#b8d3ec;background:var(--accent-bg);color:var(--accent)}
  .chip.cached::after{content:" ●";color:var(--ok);font-size:9px;vertical-align:1px}

  .ex{display:flex;flex-direction:column;gap:6px}
  .ex button{text-align:left;font-size:12.5px;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;background:#fff;cursor:pointer;line-height:1.5}
  .ex button:hover{border-color:#b8d3ec;background:var(--accent-bg)}

  .artcard{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#fff}
  .artcard .t{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
  .artcard .m{font:11px/1.6 var(--mono);color:var(--tx-3);margin-top:3px;word-break:break-all}
  .artcard .acts{display:flex;gap:8px;margin-top:8px}
  .artcard a,.artcard button{font-size:12px;padding:5px 11px;border-radius:6px;
    border:1px solid var(--line);background:#fff;cursor:pointer;text-decoration:none;color:var(--tx)}
  .artcard a.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .empty{font-size:12px;color:var(--tx-3)}

  .tl{display:flex;flex-direction:column;gap:4px;font:12px/1.5 var(--mono)}
  .tl .row{display:flex;gap:7px;align-items:baseline}
  .tl .n{color:var(--tx-3);font-variant-numeric:tabular-nums;min-width:14px;text-align:right}
  .tl .a{color:var(--accent)}
  .tl .f{color:var(--bad)}
  .tl .d{color:var(--warn)}
  .tl .c{color:#5b3f96}
  .tl .r{color:#5b3f96}

  dialog#vw{width:min(1200px,94vw);height:min(88vh,900px);border:0;border-radius:12px;padding:0;
    background:var(--panel);box-shadow:0 12px 40px rgba(20,30,45,.28)}
  dialog#vw::backdrop{background:rgba(20,30,45,.5)}
  dialog#vw .bar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
  dialog#vw .bar .nm{font:12px/1.5 var(--mono);color:var(--tx-2);flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  dialog#vw .bar button{padding:5px 12px;border:1px solid var(--line);border-radius:6px;
    background:#fff;cursor:pointer;font-size:12px}
  dialog#vw iframe{width:100%;height:calc(100% - 44px);border:0;display:block}

  /* 登录浮层。用 <dialog> 而不是自绘遮罩：Esc 关闭、焦点陷阱、::backdrop 都是原生的。 */
  dialog#lg{width:min(340px,92vw);border:0;border-radius:12px;padding:0;
    background:var(--panel);box-shadow:0 12px 40px rgba(20,30,45,.28)}
  dialog#lg::backdrop{background:rgba(20,30,45,.5)}
  dialog#lg .lgbody{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px}
  dialog#lg h2{margin:0;font-size:14px;font-weight:600}
  dialog#lg p{margin:0;font-size:12px;color:var(--tx-2);line-height:1.6}
  dialog#lg input{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  dialog#lg button{height:34px;border:0;border-radius:8px;background:var(--accent);
    color:#fff;font-weight:600;cursor:pointer}
  dialog#lg .lgerr{color:var(--bad);font-size:12px;min-height:16px}
</style>
</head>
<body>

<header>
  <h1>AirNav-Agent</h1>
  <span class="sub" id="sub">加载中…</span>
  <span class="spacer"></span>
  <label class="field">后端
    <select id="backend"></select>
  </label>
  <label class="field" title="作为会话默认值传给 Agent；若问题里明确写了外径，模型会以问题里的为准">
    默认器械 mm
    <input id="diameter" type="number" step="0.1" min="0" max="20" value="2.0">
  </label>
  <label class="field">步数
    <input id="maxsteps" type="number" step="1" min="1" max="16" value="8">
  </label>
  <span id="status"></span>
</header>

<main>
  <section class="chat">
    <div id="log">
      <div class="msg agent">经支气管肺结节导航规划。问一个问题开始 —— 右侧可以直接挑病例和示例。</div>
    </div>
    <form id="composer">
      <textarea id="q" rows="1" placeholder="例如：LIDC_0089 的 3 号候选能过 2.0mm 的器械吗？（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send" type="submit">发送</button>
    </form>
  </section>

  <aside>
    <h2>病例</h2>
    <div class="cases" id="cases"><span class="empty">—</span></div>

    <h2>示例问题</h2>
    <div class="ex" id="examples"></div>

    <h2>工具轨迹</h2>
    <div class="tl" id="trace"><span class="empty">还没有调用</span></div>

    <h2>产物</h2>
    <div id="artifacts"><span class="empty">还没有产物</span></div>
  </aside>
</main>

<dialog id="vw">
  <div class="bar">
    <span class="nm" id="vwname"></span>
    <a id="vwtab" href="#" target="_blank">新标签打开</a>
    <button id="vwclose" type="button">关闭</button>
  </div>
  <iframe id="vwframe" src="about:blank" title="三维导航视图"></iframe>
</dialog>

<!--
  鉴权（P0）。页面壳 `GET /` 是公开的 —— 它只是空壳，不含任何病例数据；
  真正的数据面 `/api/*` 与 `/artifacts/*` 全部鉴权。所以「没登录」不是在打开
  页面时发现的，而是在**取数据**时由服务端的 401 告诉我们的，见下面的 showLogin()。
-->
<dialog id="lg">
  <form class="lgbody" id="lgform">
    <h2>需要访问令牌</h2>
    <p>病例、路径规划与三维视图都属受保护数据，鉴权后才可用。令牌问运维要。</p>
    <input id="lgtoken" type="password" placeholder="访问令牌" autocomplete="off">
    <div class="lgerr" id="lgerr"></div>
    <button type="submit">进入</button>
  </form>
</dialog>

<script>
(function(){
  "use strict";
  const $ = (id) => document.getElementById(id);
  const log = $("log"), trace = $("trace"), arts = $("artifacts");
  let busy = false, backendDefault = "gpu41";
  const artByName = {};   // 文件名 -> 产物 URL，见 renderArtifacts
  // 产物 id -> {url, filename, kind}。模型会把 `route-001` 这种 id 当成链接写进回答
  // （因为工具返回体里曾经真的暴露过它），所以要能识别出来 —— 有这个 id 但它
  // **没有文件**时，就地把死链换成一句能看懂的话，而不是让它渲染成破图。
  const artById = {};
  const ART_ID_RE = /^(?:route|viewer|segmentation)-\d+$/;

  // 产物 kind → 界面上的中文名。`route` 是**内存对象**（没有文件、没有 URL），
  // 它出现在列表里是对的 —— 告诉用户「这一版路径结果存下来了」，
  // 只是没有「查看」按钮可给。
  const KIND_LABEL = { viewer: "三维导航视图", route: "路径结果", segmentation: "气道分割" };
  const kindLabel = (k) => KIND_LABEL[k] || k;

  // ---------- 小工具 ----------
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // 模型会在回答里贴两种东西，都要在这里就地处理掉：
  //
  // ① 本地文件路径（`D:\...\viewer_x.html`）—— 挡不住，因为 render_viewer 的
  //    返回里本来就带 `viewer_path`，模型只是把它抄出来（和 E01 同一条教训）。
  // ② 产物 **id**（`route-001`）—— 以前工具返回体里真的暴露过 `artifact_id`，
  //    模型就把它当链接写成了 `![](route-001)`，在浏览器里是一张破图；
  //    甚至会顺着说「三维视图已生成，ID 为 route-001」—— 可它根本没出图。
  //    （源头已在 agent/tools/imaging.py 里去掉，这里是**第二道防线**：
  //     万一模型还是写出来，也必须让人看懂，不能是个死链。）
  //
  // 做法：先把命中的东西换成占位符（免得被下面的 markdown 规则搅乱），
  // 最后统一还原成按钮 / 说明文字。
  const PH_A = "\u0001A", PH_I = "\u0001I", PH_B = "\u0001";
  // 占位符里把 id 的 `-` 换成 \u0002 —— 否则「再兜一遍裸 id」那一步会把
  // 自己刚写进去的占位符又匹配一次，套成两层。
  const ID_SEP = "\u0002";
  function markArtifacts(text){
    function swap(whole, target){
      const t = String(target);
      // ① 有登记文件名的 → 换成按钮
      const name = t.split(/[\\/]/).pop();
      if (artByName[name]) return PH_A + artByName[name] + PH_B + name + PH_B;
      // ② 长得像产物 id 的 → 交给 restore 决定（可点 / 说明它不是文件）
      //    这里必须先校验形状，restore 才能安全地把它原样放进 HTML。
      if (ART_ID_RE.test(t)) return PH_I + t.replace(/-/, ID_SEP) + PH_B;
      return whole;
    }
    // `!?` 不能省：模型实测会写 markdown **图片**语法 `![](D:\...\x.html)`
    // （比 `[文字](路径)` 更常见，因为它把 viewer 当成一张图）。
    // 只匹配 `[..](..)` 的话，开头的 `!` 会留在原地变成正文里的孤零零一个叹号。
    return (
      text
        // ① 裸文件名（模型被引导成说「三维视图文件：viewer_x.html」，这是好行为，
        //    但网页里得能点）。**只认登记表里有的名字**，所以不会误伤正文里
        //    随手出现的 xxx.html。必须排在路径/链接之前 —— 否则它会命中
        //    前面刚写进去的占位符，套成两层。
        //    前置断言排除 `(` `/` `\`：那些是链接目标或路径的一部分，交给下面两行。
        .replace(
          /(?<![\w.\/\\()\[\]-])([A-Za-z0-9_.-]+\.(?:html|json))(?![\w\/])/g,
          (m, name) =>
            artByName[name] ? PH_A + artByName[name] + PH_B + name + PH_B : m
        )
        .replace(
          /!?\[[^\]]*\]\(([^)\s]+\.(?:html|json)|[a-z]+-\d+)\)/g,
          (m, target) => swap(m, target)
        )
        .replace(/[A-Za-z]:\\[^\s)\]<>"'，。；]*\.(?:html|json)/g, (m) => swap(m, m))
        // 最后再兜一遍**散文里裸提的 id**：「三维视图已生成，ID 为 route-001」
        // 这种句子比死链更误导（它直接断言了一件没发生的事）。
        // 前后断言里带上 \u0001 和 `.`：前面几行已经写进去的占位符里含文件名，
        // 万一它长得像 `route-001.html`，这里不能再咬一口（会套成两层）。
        .replace(
          /(?<![\w\u0001-])(?:route|viewer|segmentation)-\d+(?![\w\u0001.-])/g,
          (m) => swap(m, m)
        )
    );
  }
  function restoreArtifacts(text){
    return (
      text
        .replace(
          /\u0001A([^\u0001]+)\u0001([^\u0001]+)\u0001/g,
          (m, url, name) =>
            '<button type="button" class="inline-art" data-open="' + url +
            '" data-name="' + name + '">打开三维视图</button>'
        )
        // 产物 id：真能点就出按钮，否则把它「不是文件」这件事说清楚。
        .replace(/\u0001I([^\u0001]+)\u0001/g, (m, raw) => {
          const id = raw.replace(ID_SEP, "-");
          const hit = artById[id];
          if (hit && hit.url){
            return '<button type="button" class="inline-art" data-open="' + hit.url +
                   '" data-name="' + (hit.filename || id) + '">打开三维视图</button>';
          }
          return '<span class="dead-ref">' + (hit ? "这里没有可查看的文件（" + id
            + " 只是内部数据留痕）" : "引用了不存在的产物 " + id)
            + "，需要三维视图请让我出图</span>";
        })
    );
  }

  // 极简 markdown：**粗体**、`代码`、- 列表。先把 HTML 转义掉再换标记。
  function md(text){
    const lines = markArtifacts(esc(text)).split("\n");
    let out = "", list = false;
    for (const raw of lines){
      let line = raw
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
      const m = line.match(/^\s*[-*]\s+(.*)$/);
      if (m){
        if (!list){ out += "<ul>"; list = true; }
        out += "<li>" + m[1] + "</li>";
      } else {
        if (list){ out += "</ul>"; list = false; }
        out += line + "\n";
      }
    }
    if (list) out += "</ul>";
    return restoreArtifacts(out.replace(/\n/g, "<br>"));
  }
  function addMsg(kind, text){
    const el = document.createElement("div");
    el.className = "msg " + kind;
    if (kind === "agent") el.innerHTML = md(text); else el.textContent = text;
    log.appendChild(el); log.scrollTop = log.scrollHeight;
    return el;
  }
  function scrollDown(){ log.scrollTop = log.scrollHeight; }

  // ---------- 鉴权 ----------
  // 一律以服务端返回的 401 为准，不在前端猜「有没有登录」—— 前端没有可信的
  // 登录态来源（Cookie 是 HttpOnly 的，脚本读不到）。这也是设计上想要的：
  // 登录态只由服务端判定，前端只是它的显示器。
  const lg = $("lg");
  function showLogin(msg){
    $("lgerr").textContent = msg || "";
    $("sub").textContent = "未登录";
    if (!lg.open) lg.showModal();
    $("lgtoken").focus();
  }
  function authProbe(){
    // SSE 的 onerror 拿不到状态码（EventSource 不暴露），只能另发一个探针请求
    // 去分辨「没登录 / 会话过期」和「服务真的挂了」——
    // 这两件事的处理完全不同，混成一句「连接中断」会把排查方向带偏。
    // 探针本身失败（服务确实挂了）时返回 false，落到「连接中断」那一支。
    return fetch("/api/meta", {cache: "no-store"}).then(
      (r) => r.status === 401,
      () => false
    );
  }

  // ---------- 初始化 ----------
  fetch("/api/meta").then(r => {
    if (r.status === 401){ showLogin(""); return null; }
    return r.json();
  }).then(meta => {
    if (!meta) return;   // 未登录：留在登录浮层上，不再往下初始化
    backendDefault = meta.default_backend;
    const sel = $("backend");
    sel.innerHTML = "";
    meta.backends.forEach(b => {
      const o = document.createElement("option");
      o.value = b; o.textContent = b; sel.appendChild(o);
    });
    sel.value = meta.default_backend;
    $("sub").textContent = meta.cases.length + " 个病例 · " + meta.tools.length + " 个工具";

    const box = $("cases");
    if (!meta.cases.length){ box.innerHTML = '<span class="empty">cases/ 里没有病例</span>'; }
    else {
      box.innerHTML = "";
      meta.cases.forEach(c => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (c.cached ? " cached" : "");
        b.textContent = c.case_id;
        b.title = c.cached ? "已缓存（加载快）" : "未缓存（首次加载较慢）";
        b.onclick = () => { $("q").value = c.case_id + " 哪个结节最容易到达"; $("q").focus(); };
        box.appendChild(b);
      });
    }

    const first = meta.cases.find(c => c.cached) || meta.cases[0];
    const id = first ? first.case_id : "LIDC_0089";
    const exs = [
      id + " 哪个结节最容易到达",
      "给 " + id + " 的 3 号候选规划一条路径",
      "给 " + id + " 的 3 号候选出一张三维视图",
      id + " 的 3 号候选为什么被选中？",
      "3 号候选走宽气道和平缓转弯哪个更好？",
      "给这个病例推荐一个支气管镜型号",
    ];
    const ex = $("examples");
    ex.innerHTML = "";
    exs.forEach(t => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = t;
      b.onclick = () => { $("q").value = t; $("q").focus(); };
      ex.appendChild(b);
    });
  }).catch(e => { $("sub").textContent = "元信息加载失败：" + e; });

  // ---------- 轨迹 ----------
  function traceRow(cls, num, text){
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<span class="n">' + esc(num) + '</span><span class="' + cls + '">' + esc(text) + "</span>";
    trace.appendChild(row); trace.scrollTop = trace.scrollHeight;
  }
  function clearIfEmpty(){
    const e = trace.querySelector(".empty");
    if (e) e.remove();
  }

  // ---------- 产物 ----------
  function renderArtifacts(items){
    if (!items || !items.length){
      arts.innerHTML = '<span class="empty">这次没有落盘产物</span>';
      return;
    }
    arts.innerHTML = "";
    items.forEach(it => {
      const d = document.createElement("div");
      d.className = "artcard";
      const title = kindLabel(it.kind);
      let html = '<div class="t">' + esc(title) +
        ' <span class="pill ' + (it.kind === "viewer" ? "ok" : "run") + '">' + esc(it.id || it.kind) + "</span></div>";
      // id 已经在 pill 里了，这里只放业务口径，不重复。
      // 用 `!= null` 而不是真值判断：candidate_id 为 0 是合法值。
      html += '<div class="m">' + esc(it.case_id || "") +
        (it.candidate_id != null ? " · 候选 " + esc(it.candidate_id) : "") +
        (it.profile ? " · " + esc(it.profile) : "") +
        (it.size_mb ? " · " + esc(it.size_mb) + " MB" : "") + "</div>";
      if (it.url){
        // 登记文件名 → URL，供 md() 把回答里贴的本地路径换成按钮
        if (it.filename) artByName[it.filename] = it.url;
        html += '<div class="acts">' +
          '<button type="button" class="primary" data-open="' + esc(it.url) + '" data-name="' + esc(it.filename) + '">页内查看</button>' +
          '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">新标签打开</a></div>';
      }
      // 所有产物都按 id 登记（**包括没有 url 的**）：模型可能引用 `route-001`，
      // 有 url 的出按钮，没有 url 的也要能说清「它不是文件」，而不是变成破图。
      if (it.id) artById[it.id] = { url: it.url || "", filename: it.filename || "", kind: it.kind };
      d.innerHTML = html;
      arts.appendChild(d);
    });
  }

  const vw = $("vw");
  function openViewer(url, name){
    if (!url) return;
    $("vwframe").src = url;
    $("vwname").textContent = name || "";
    $("vwtab").href = url;
    vw.showModal();
  }
  // 右侧卡片和回答里的内联按钮都用同一套 data-open，统一委托到这两个容器
  [arts, log].forEach(host => host.addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-open]");
    if (btn) openViewer(btn.getAttribute("data-open"), btn.getAttribute("data-name"));
  }));
  $("vwclose").onclick = () => { vw.close(); $("vwframe").src = "about:blank"; };
  vw.addEventListener("close", () => { $("vwframe").src = "about:blank"; });

  // ---------- 发送 ----------
  function setBusy(v){
    busy = v;
    $("send").disabled = v;
    $("status").textContent = v ? "规划中…" : "";
  }

  function run(question){
    if (busy || !question.trim()) return;
    setBusy(true);
    addMsg("user", question);
    trace.innerHTML = '<span class="empty">还没有调用</span>';
    arts.innerHTML = '<span class="empty">还没有产物</span>';
    // 清掉上一次的产物登记，否则旧文件名/旧 id 会被映射到旧 URL
    Object.keys(artByName).forEach(k => { delete artByName[k]; });
    Object.keys(artById).forEach(k => { delete artById[k]; });

    const box = document.createElement("div");
    box.className = "runbox";
    log.appendChild(box);
    const cards = {};         // name -> {el, pill, ms}
    let stepLabel = null;

    function ensureStep(n){
      if (stepLabel && stepLabel.dataset.step === String(n)) return;
      stepLabel = document.createElement("div");
      stepLabel.className = "step"; stepLabel.dataset.step = String(n);
      stepLabel.textContent = "STEP " + n;
      box.appendChild(stepLabel);
      scrollDown();
    }

    const params = new URLSearchParams({
      q: question,
      backend: $("backend").value || backendDefault,
      device_diameter: $("diameter").value || "0",
      max_steps: $("maxsteps").value || "8"
    });
    const es = new EventSource("/api/chat?" + params.toString());
    let finished = false;

    function finish(msg){
      if (finished) return;
      finished = true;
      es.close();
      if (msg) addMsg("err", msg);
      setBusy(false);
    }

    es.onmessage = function(ev){
      let d;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      switch (d.type){
        case "start":
          traceRow("a", "", "后端 " + d.backend);
          break;

        case "tool_start": {
          ensureStep(d.step);
          clearIfEmpty();
          const el = document.createElement("div");
          el.className = "tool";
          el.innerHTML = '<span class="nm">' + esc(d.name) + "</span>" +
            '<span class="ar">' + esc(JSON.stringify(d.arguments)) + "</span>" +
            '<span class="pill run">运行中</span><span class="ms"></span>';
          box.appendChild(el);
          cards[d.name] = {el: el, pill: el.querySelector(".pill"), ms: el.querySelector(".ms")};
          traceRow("a", d.step, d.name);
          scrollDown();
          break;
        }

        case "tool_done": {
          const c = cards[d.name];
          if (c){
            c.pill.className = "pill " + (d.ok ? "ok" : "fail");
            c.pill.textContent = d.ok ? "完成" : "失败";
            c.ms.textContent = d.elapsed_ms + " ms";
          }
          if (!d.ok) traceRow("f", d.step, d.name + " 失败");
          break;
        }

        case "deferred": {
          ensureStep(d.step);
          const n = document.createElement("div");
          n.className = "note defer";
          n.textContent = d.note || ("延后一步：" + d.names.join(", "));
          box.appendChild(n);
          traceRow("d", d.step, "延后 " + d.names.join(","));
          scrollDown();
          break;
        }

        case "correction": {
          ensureStep(d.step);
          const n = document.createElement("div");
          n.className = "note corr";
          n.textContent = d.note || "触发纠偏";
          box.appendChild(n);
          traceRow("c", d.step, "纠偏 " + d.kind + (d.count ? " #" + d.count : ""));
          scrollDown();
          break;
        }

        // 模型把工具调用写成了正文（Qwen 原生格式漏进 content，见 agent_loop 规则 C）。
        // 这一类**不纠偏**：循环认出这段 JSON 是完整可执行的调用，直接代为执行。
        // 界面上必须显出来 —— 不然「代执行才跑通」和「一次到位」看起来一模一样。
        case "recovered": {
          ensureStep(d.step);
          const names = d.names || [];
          const n = document.createElement("div");
          n.className = "note corr";
          n.textContent = d.note || ("把工具调用写成了正文，已代为执行：" + names.join(", "));
          box.appendChild(n);
          traceRow("r", d.step, "代为执行 " + names.join(","));
          scrollDown();
          break;
        }

        case "artifacts":
          renderArtifacts(d.items);
          break;

        case "final": {
          if (d.answer) addMsg("agent", d.answer);
          const s = document.createElement("div");
          s.className = "stats";
          s.innerHTML = "<b>" + d.steps + "</b> 步 · <b>" + d.tool_calls + "</b> 次工具调用 · <b>" +
            d.elapsed_s + "s</b> · " + esc(d.stop_reason) +
            (d.intent_corrections ? " · 纠偏 " + d.intent_corrections : "") +
            (d.recovered_toolcalls ? " · 代为执行 " + d.recovered_toolcalls : "");
          box.appendChild(s);
          scrollDown();
          break;
        }

        case "error":
          addMsg("err", d.message);
          break;

        case "done":
          finish(null);
          break;
      }
    };

    es.onerror = function(){
      // 服务端正常收尾也会走到这里，finished 已经把这情况挡掉了。
      if (finished) return;
      // 被 401 拒掉时同样走这里，而且**拿不到状态码** —— 探一下再决定怎么说。
      authProbe().then(is401 => {
        if (!is401){ finish("连接中断（服务是否还在运行？）"); return; }
        // 会话过期：先把浮层顶出来，再照常收尾（不额外报错，浮层已经说清楚了）
        showLogin("会话已过期，请重新登录");
        finish(null);
      });
    };
  }

  $("composer").addEventListener("submit", function(ev){
    ev.preventDefault();
    const q = $("q").value;
    $("q").value = "";
    run(q);
  });
  $("q").addEventListener("keydown", function(ev){
    if (ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); $("composer").requestSubmit(); }
  });
  // ---------- 登录提交 ----------
  $("lgform").addEventListener("submit", function(ev){
    ev.preventDefault();
    const t = $("lgtoken").value.trim();
    if (!t){ $("lgerr").textContent = "请填令牌"; return; }
    const fd = new FormData();
    fd.append("token", t);
    // 服务端成功回 303（PRG 模式）：cookie 随这次响应种下，follow 之后拿到 `/` 的 200。
    // 失败回 401 且不重定向 —— 就地报错，用户不必离开页面再回来。
    fetch("/login", {method: "POST", body: fd}).then(r => {
      if (r.ok){ location.reload(); return; }
      $("lgerr").textContent = "令牌不对";
      $("lgtoken").value = "";
      $("lgtoken").focus();
    }).catch(e => { $("lgerr").textContent = "请求失败：" + e; });
  });

  window.addEventListener("load", () => $("q").focus());
})();
</script>
</body>
</html>
