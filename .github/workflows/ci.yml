name: regression gate

# 回归门禁：把「改动前先过回归」从习惯变成流水线。
#
# ⚠️ 已知边界（别假装没有）：
#   1. `cases/`（1.9GB 真实病例）**不入库**（隐私 + 体积，见 .gitignore）。
#      → 已解决：仓库自带**合成夹具** `fixtures/cases`（26 KB/例，实测 26730 B，见
#        `docs/合成夹具.md`）。case_loader 在真实病例缺席时兜底到它，
#        于是 `--profile ci` 现在跑**全部 15 项**（不再是「不依赖病例的子集」）。
#
#        ⚠️ 其中 `planner` 会明确报 ⚪「不足以判定」：夹具没有 `interactive_plans/`，
#        与 V1 GUI 的数值对拍**没做** —— 是「没做」，不是「做对了」。
#        ⚪ 不设退出码 1（否则干净副本上的 CI 永远红着，门禁就没人看了），
#        但它也**不**算通过（`passed = not failed and not undecided and baseline_ok`）。
#
#        仍然跑不了的只有真模型评测（见下条）。
#   2. 评测基线用的是 `heuristic` 规则基线后端：确定性、不联网、不需要 GPU。
#      真模型评测（gpu41 / qwen2.5:14b）依赖内网与 GPU，留在本地手动跑。
#
# 远端：https://github.com/cqcq-lzb/AirNav-Agent （私有）
# 首次绿色运行 2026-09-30（run 36680366917，7m20s，结论 14 通过 / 0 失败 / 1 不足以判定）。
# 此后每次 push 到 main 都会自动跑；本地等价入口是 `跑回归门禁.bat`。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # Qt / VTK 在无显示环境里 import 会去找 GL 与 xkbcommon 这类系统库，
      # ubuntu runner 上不保证都有 —— 缺了会以 ImportError 的形式报在「跑门禁」那一步，
      # 很难一眼看出是系统库而不是 pip 包。先装上，代价几秒钟。
      - name: Install headless GL libs (for Qt / VTK import)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      # 依赖清单收在根目录 requirements.txt（唯一真相源，别再往这里手写包名）。
      # ⚠️ 这份清单以前是手写的 5 个包（numpy scipy starlette uvicorn SimpleITK），
      #    而 agent/ 实际还 import 了 pydantic / pydicom / scikit-image / mcp /
      #    packaging / requests，且 navbridge 在模块级拉起了 V1 内核（要 vtk + PySide6）
      #    —— 少了任何一个都会在跑门禁时炸。现已改为按清单安装。
      - name: Install runtime deps for offline checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run regression gate (ci profile)
        # 显式指向合成夹具，让「这份数据是哪来的」在报告里一目了然。
        # （不设也能跑 —— case_loader 会兜底到 fixtures/cases，但显式更清楚。）
        env:
          AIRNAV_CASES_DIR: ${{ github.workspace }}/fixtures/cases
        run: python -m agent.scripts.gate --profile ci

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: outputs/gate/gate_report.*
          if-no-files-found: warn
